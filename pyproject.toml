[project]
name = "rebang-tools"
version = "0.0.0"
description = "Tooling for Rebang"
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0",
]

[tool.uv]
package = false

[tool.ruff]
include = ["tools/**/*.py"]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.src]
include = ["tools"]

[tool.ty.environment]
python-version = "3.10"
